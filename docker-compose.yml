services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  sentinel:
    build: .
    ports:
      - "8080:8080"
    environment:
      SENTINEL_HOST: 0.0.0.0
      SENTINEL_DATABASE_URL: postgresql://sentinel:sentinel-local@postgres:5432/sentinel
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_ASYNC_WORKERS: 4
      SENTINEL_SKILLS_DIR: /app/skills
      SENTINEL_AUTH_REQUIRED: "true"
      SENTINEL_AUTH_SECRET: ${SENTINEL_AUTH_SECRET:-local-only-change-this-secret-123456}
      SENTINEL_BOOTSTRAP_ADMIN_USERNAME: ${SENTINEL_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SENTINEL_BOOTSTRAP_ADMIN_PASSWORD: ${SENTINEL_BOOTSTRAP_ADMIN_PASSWORD:-sentinel-local-admin}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
